# SPDX-License-Identifier: Apache-2.0
# hipfire fixture and quality pins: the machine-checkable facts behind the
# rules in AGENTS.md. Prose (what each fixture is, how a pin is reproduced,
# caveats) lives in docs/fixtures.md; this file holds the values.
#
# Schema and rules: scripts/check-pins.py (run by scripts/ci-gates.sh).
#   [<kind>."<id>"]  kind = model | draft | sidecar | reference | prompt | evaluator | kld
#   status    current | previous | historical | retired
#   date      YYYY-MM-DD the pin entered the repo (or the stated pin date)
#   pinned_in commit that introduced the pin (git log -S on AGENTS.md)
#   mirrored_in  files that carry a copy of the same digest; check-pins fails
#                when a copy drifts (registry, compiled pins, gate JSON)
# Cite a pin from docs or scripts as `pin:<kind>/<id>`; check-pins fails on a
# citation of a pin that does not exist.
#
# Re-pin: edit the entry here in the same commit as the change that moves it,
# with its evaluator (build commit + binary md5) and receipt path, and update
# `kld/VERIFY.md` on the model's Hugging Face repo. Never edit a value without
# a receipt; superseded current pins become `previous`, not deleted.

schema = "hipfire.pins"
version = 1

