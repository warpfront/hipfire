# Example ~/.hipfire/config.toml for normal run and serve usage.
# Delete a key to return it to registry/compiled inheritance.
schema_version = 1

[generation]
# Sampling fields are intentionally omitted here so each registry model card can
# supply its complete recommended recipe. The same goes for everything the
# registry card or the GPU architecture resolves on its own (max_tokens,
# reasoning, kv_cache, max_seq, flash, prompt, speculation): the "default"
# profile leaves them at auto. Pin overrides per model with, e.g.:
#   hipfire config qwen3.6:35b-a3b-mq4r set generation.temperature 0.8
#   hipfire config qwen3.6:35b-a3b-mq4r set generation.top_k 20
loop_guard_threshold = 0
loop_guard_window = 256

[memory]
# Replaces HIPFIRE_PROMPT_CACHE_CAP=32.
prompt_cache_capacity = 32
prompt_cache_unbounded = false

[serve]
# Loopback by default: the serve surface has no authentication and advertises
# a permissive HTTP API, so binding a LAN address must be an explicit choice.
host = "127.0.0.1"
port = 11435
# Replaces HIPFIRE_IDLE_TIMEOUT=300.
idle_timeout_seconds = 300
local = false
# Serve requests concurrently on the multi-slot engine instead of one at a
# time. Off by default; the single-daemon path is unchanged when false.
# Concurrent requests can produce different greedy text than serial requests
# at >=4 slots; output is deterministic for a fixed batch composition. 2 slots
# matched serial in testing.
multi_slot = false
