[package]
name = "hipfire-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hipfire daemon — JSON IPC engine (standalone binary)"
# Shares the CLI's build script: it emits HIPFIRE_BUILD_COMMIT (full commit,
# HIPFIRE_BUILD_COMMIT_OVERRIDE honoured) for `--version`. It reads only
# CARGO_MANIFEST_DIR (../.. = repo root), CARGO_PKG_VERSION, TARGET and git.
build = "../hipfire-cli/build.rs"

[[bin]]
name = "daemon"
path = "src/main.rs"

[features]
default = ["deltanet", "vcn-jpeg"]
deltanet = [
    "hipfire-runtime/deltanet",
    "rdna-compute/deltanet",
    "hipfire-pflash/deltanet",
    "hipfire-arch-qwen35-vl/deltanet",
]
flash-attn-ck = [
    "rdna-compute/flash-attn-ck",
    "hipfire-runtime/flash-attn-ck",
]
serve-fault-inject = ["hipfire-runtime/serve-fault-inject", "hipfire-generate/serve-fault-inject"]
ep-fault-inject = ["hipfire-loader/ep-fault-inject", "hipfire-runtime/ep-fault-inject"]
qwen4-dev-profiles = [
    "hipfire-loader/qwen4-dev-profiles",
    "hipfire-generate/qwen4-dev-profiles",
]
# VCN JPEG decode for VL images (`image.decode = vcn|auto`): pooled libva
# decode straight to device patches. Compiled into the normal product build
# (default) so `cargo build --release -p hipfire-daemon` serves it; the
# runtime default stays `cpu` (`image.decode`, HIPFIRE_IMAGE_DECODE), and
# libva/ROCm stay dlopen-only — no link-time GPU dependency.
vcn-jpeg = ["hipfire-generate/vcn-jpeg"]

[dependencies]
# Layering: saddle-core -> hipfire-runtime -> hipfire-loader -> hipfire-engine -> daemon
# Daemon sits above all of them and may depend on every arch crate unconditionally.
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-loader = { path = "../hipfire-loader" }
hipfire-engine = { path = "../hipfire-engine" }
hipfire-generate = { path = "../hipfire-generate" }
hipfire-pflash = { path = "../hipfire-pflash" }
hipfire-arch-qwen35 = { path = "../hipfire-arch-qwen35" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
saddle-core = { path = "../saddle-core" }

# Arches via loader/generate; qwen35 direct for slots.

# Direct external deps used by daemon.rs
base64 = "0.22"
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
libc = "0.2"
# hipfire-weight-host lease registry.
parking_lot = "0.12"
