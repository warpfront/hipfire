[package]
name = "hipfire-arch-qwen35-vl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5-VL (vision-language) architecture for hipfire"

[features]
# Vision tower depends on the GPU compute primitives (gemm_f16, layernorm,
# vit_attention, gelu_tanh, transpose). Those are wired through the
# `deltanet` feature on `rdna-compute` / `hipfire-runtime` today; gating the
# vl crate with the same flag keeps `--no-default-features` builds working
# (vision is a no-op stub when deltanet is off).
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]
# VCN JPEG decode path (`image.decode = vcn|auto`): pooled libva decode +
# `vl_yuv_preprocess` kernels straight to device patches. Default off; the
# CPU decode path is unchanged when disabled.
vcn-jpeg = ["dep:va-bridge"]

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
va-bridge = { path = "../va-bridge", optional = true }
serde_json.workspace = true
# image preprocessing (PNG decode + resize) for the vision encoder input
# pipeline lives in this crate (`crate::image`); JPEG decode is
# `hipfire_runtime::imagedec` (libjpeg-turbo-rs). Same default-feature
# gating as runtime had pre-PR-9, minus the `jpeg` feature so zune-jpeg
# stays out of the lock.
image.workspace = true

[dev-dependencies]
# Encodes the synthetic JPEG fixtures in `tests/image_from_bytes.rs`
# (the `image` crate's JPEG encoder left with its `jpeg` feature).
libjpeg-turbo-rs.workspace = true
