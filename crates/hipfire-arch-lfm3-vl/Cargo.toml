[package]
name = "hipfire-arch-lfm3-vl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LFM3-VL (vision-language) architecture for hipfire"

[features]
# Vision tower depends on GPU compute primitives (gemm_f16, layernorm,
# vit_attention_gqa, conv2d_gated, gelu_erf, rope_2d_halfsplit) wired through
# the `deltanet` feature on rdna-compute / hipfire-runtime. Gating the vl
# crate with the same flag keeps --no-default-features builds working.
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
