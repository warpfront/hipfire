[package]
name = "hipfire-arch-lfm3-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LFM3-Audio (ASR / audio-input) architecture for hipfire"

[features]
# The audio encoder backbone reuses the GPU conv/attention/RoPE primitives
# wired through the `deltanet` feature on rdna-compute / hipfire-runtime /
# hipfire-dispatch (same gating as hipfire-arch-lfm3 / -lfm3-vl). The mel
# front-end and conv2d downsampler are pure-CPU and compile under
# --no-default-features, but the encoder/projector forward needs the GPU
# primitives, so the crate defaults to `deltanet` like its siblings.
default = ["deltanet"]
deltanet = [
    "hipfire-runtime/deltanet",
    "rdna-compute/deltanet",
    "hipfire-dispatch/from-hip-error",
]

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", optional = true }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
