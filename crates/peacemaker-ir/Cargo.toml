[package]
name = "peacemaker-ir"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
smallvec = "1"
thiserror.workspace = true
petgraph = "0.8"
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
# build.rs projects isa/*.xml.jsonl into the runtime rows (OUT_DIR/*.runtime.tbl).
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
insta = "1"
# The real-object analyzer fixtures (tests/kernarg_indexed.rs) lift a gfx1201
# code object; a dev-dependency cycle is fine, the runtime graph stays clean.
peacemaker-lift = { path = "../peacemaker-lift" }
