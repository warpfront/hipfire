[package]
name = "hipfire-arch-qwen35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5 architecture (dense + MoE) for hipfire"

[features]
# Enable hybrid DeltaNet + speculative decoding paths. Currently always-on
# because qwen35 is a hybrid arch (DeltaNet + FullAttention layers).
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]
flash-attn-ck = ["hipfire-dispatch/flash-attn-ck", "rdna-compute/flash-attn-ck"]
moe-oracle = []
# GPU bring-up probes (host-mapped/offloaded weights); build with `--features lab`.
lab = []

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
railgun = { path = "../railgun" }
hipfire-reap = { path = "../hipfire-reap", default-features = false }
saddle-core = { path = "../saddle-core" }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[build-dependencies]
# build.rs: shared-weight loader ABI identity (hashes the loader closure).
sha2.workspace = true

[dev-dependencies]
# `tests/gpu_gemv_parity.rs`: drives the production GEMV launcher against the
# CPU transcription on identical inputs. Lives here (not in hipfire-cpu) so the
# CPU crate keeps a GPU-free dependency list.
hipfire-cpu = { path = "../hipfire-cpu" }

[[example]]
name = "test_qwen35_load_multi"
path = "examples/test_qwen35_load_multi.rs"
required-features = ["deltanet"]

