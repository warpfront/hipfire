[package]
name = "hipfire-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Conformance runner: per-component state digests, executed-recipe receipts, class-checked verdicts (CPU-only first half; ships beside the lane archive)"

[lib]
name = "hipfire_conformance"
path = "src/lib.rs"

[[bin]]
name = "hipfire-conformance"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.9"
