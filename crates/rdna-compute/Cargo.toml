[package]
name = "rdna-compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute kernel dispatch for RDNA GPUs"

[features]
# Archived research probes; see the note by the [[example]] blocks.
lab = []
# Explicit timing instrumentation opt-in; neither default builds nor lab alone
# enable timing state or launch-path hooks.
kernel-timing = ["lab", "hip-bridge/kernel-timing"]
deltanet = []
flash-attn-ck = ["dep:libloading"]

[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
hipfire-kernel-abi = { path = "../hipfire-kernel-abi" }
redline-dispatch = { path = "../redline-dispatch" }
radiowave = { path = "../radiowave" }
railgun = { path = "../railgun" }
railgun-corpus = { path = "../railgun-corpus" }
libloading = { workspace = true, optional = true }
rayon = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
redline-rocr = { path = "../redline-rocr" }
half.workspace = true
peacemaker-npu = { path = "../peacemaker-npu" }
peacemaker-isa = { path = "../peacemaker-isa", features = ["toolchain"] }
peacemaker-ir = { path = "../peacemaker-ir" }
peacemaker-lift = { path = "../peacemaker-lift" }
peacemaker-rip = { path = "../peacemaker-rip" }
[[example]]
name = "bench_moe_grouped_qt44_iu4"
required-features = ["lab"]
[[example]]
name = "npu_trunk_glue_check"
required-features = ["lab"]
[[example]]
name = "npu_trunk_consumers_check"
required-features = ["lab"]
[[example]]
name = "qwen4_moe_front_oracle"
required-features = ["lab"]

[[example]]
name = "pm_moe_cn_tiled_numeric_oracle"
required-features = ["lab"]

# Single-card gfx1201 GPU gate for the bounded device spin waits
# (crate::device_wait): forced timeout, host error path, fail-fast, recovery.
[[example]]
name = "device_wait_deadline"
required-features = ["lab"]

# ---------------------------------------------------------------------------
# Archived research probes.
#
# One-question GPU experiments -- "is GPU argmax faster than downloading logits
# at vocab 129,280 on gfx1201" -- written at roughly eleven a month since
# 2026-03. They are the working method for kernel decisions and worth keeping:
# a HIP kernel cannot be measured by a unit test.
#
# Gated because an answer obtained in April should not be type-checked on every
# build in August. Ungated, they all compile under `cargo build --all-targets`,
# so every refactor drags every probe with it -- several build breaks during the
# ModelState removal were in probes nobody had run since the day they were
# written.
#
# Run on demand:  cargo build -p <crate> --examples --features lab
# The UNGATED example count is ratcheted; see scripts/leanup-ratchets.sh.
# ---------------------------------------------------------------------------
