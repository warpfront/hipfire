[package]
name = "hipfire-arch-raon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[features]
lab = []
default = ["deltanet"]
deltanet = ["rdna-compute/deltanet", "hipfire-runtime/deltanet"]

# Raon module/state/logits/bench oracle (PLAN §6.2). Exercises production
# launchers; built with --features lab.
[[example]]
name = "raon_oracle"
required-features = ["lab"]

# Raon DFlash2 oracle: device feature capture vs the tapped reference, draft emit
# dump for the torch reference, verify row-exactness, AR vs DFlash greedy.
# Built with --features lab.
[[example]]
name = "raon_dflash_oracle"
required-features = ["lab"]

# Prepared-A8 activation reuse node-chain bench (PLAN §6 G1); gfx1201, run through fabric.
# Built with --features lab.
[[example]]
name = "bench_a8_reuse_chain"
required-features = ["lab"]

# Raon band oracles: one layer cut on one device (`raon_band_oracle`) and the
# generic mesh executor over per-rank bands (`raon_mesh_oracle`), each against the
# whole-model run. Built with --features lab.
[[example]]
name = "raon_band_oracle"
required-features = ["lab"]

[[example]]
name = "raon_mesh_oracle"
required-features = ["lab"]
[dev-dependencies]
md5 = "0.8"

# One Raon RDA layer (`rda_forward_rows`) on synthetic raw projections: bit digest across
# HIPFIRE_RAON_RDA_* flags and per-layer timing (needs a gfx1201 GPU). Built with --features lab.
[[example]]
name = "rda_layer_node"
required-features = ["lab"]
