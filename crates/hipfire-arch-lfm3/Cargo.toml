[package]
name = "hipfire-arch-lfm3"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Host-readback helpers and hybrid-state plumbing live behind `deltanet`
# (mirrors lfm2moe). The conv/attention kernels the forward uses are ungated.
default = ["deltanet"]
deltanet = ["rdna-compute/deltanet", "hipfire-runtime/deltanet"]
