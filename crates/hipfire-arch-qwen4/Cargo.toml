[package]
name = "hipfire-arch-qwen4"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen4/ Qwen3.8-Flash-Next text configuration, PLE hashing, admission, and manifest foundations"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
rdna-compute = { path = "../rdna-compute", features = ["deltanet"] }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["deltanet"] }
smallvec = { version = "1.15.2", features = ["const_generics"] }
sha2.workspace = true
tracing = "0.1"
peacemaker-npu = { path = "../peacemaker-npu" }
rayon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
railgun = { path = "../railgun", features = ["npu"] }

# The D2 tail's slot/generation API (`railgun::sealed_table::generation`) is GPU-free and has no
# platform code: off Linux the crate builds it without the HIP-interop `npu` feature.
[target.'cfg(not(target_os = "linux"))'.dependencies]
railgun = { path = "../railgun" }

[dev-dependencies]
half.workspace = true
memmap2.workspace = true
# `mtp_head_reference_pin_hw` decodes the artifact head tensors the HIP head reads (qt44 / qt53 experts).
hipfire-cpu = { path = "../hipfire-cpu" }
saddle-quant = { path = "../saddle-quant" }
# `greedy_mtp_identity_hw` loads through the product loader (`load_qwen4_rank`) so the
# split-base PLE sidecar, trunk overlay and expert hot set are the serve load's own.
# hipfire-loader depends on this crate as a normal edge; dev-dep cycles are legal
# (same pattern as hipfire-runtime's dev-dependency on hipfire-loader).
hipfire-loader = { path = "../hipfire-loader" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["test-utils"] }

[features]
# Explicit developer build opt-in; never part of the default serving build.
qwen4-dev-profiles = []
reference-parity = ["rdna-compute/lab", "hipfire-dispatch/test-utils"]
# Tools-only S1 validation surface: the lab feature enables the S1
lab = ["hipfire-dispatch/test-utils"]
kernel-timing = ["lab", "rdna-compute/kernel-timing"]
[[example]]
name = "hc_pair_decode_oracle"
required-features = ["lab"]

[[example]]
name = "qwen4_parity"
required-features = ["reference-parity"]

[[example]]
name = "qwen4_qsa_ctx"
required-features = ["reference-parity"]

[[example]]
name = "qwen4_qsa_arena_check"
required-features = ["reference-parity"]

[[example]]
name = "qwen4_mtp_fill"
required-features = ["reference-parity"]

[[example]]
