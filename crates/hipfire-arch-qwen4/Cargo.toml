required-features = ["reference-parity"]

[[example]]
name = "qwen4_rowtile_capture"
required-features = ["reference-parity"]

[[example]]
name = "qwen4_legacy_mq4_rowtile_oracle"
required-features = ["lab", "reference-parity"]

[[example]]
name = "qwen4_kld"
