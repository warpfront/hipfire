[package]
name = "railgun"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "railgun certified dispatch programs: program model (design §1.1); MC copy nodes and copy kernels; M1 kernel nodes from certified facts, the gfx12 cache table, PM4 boundary plan and the G7 shadow diff"
publish = false

# A runtime crate: it must never reach peacemaker, dev-dependencies included
# (checked by peacemaker-ir's `runtime_dependency_graph_does_not_include_peacemaker`).
[dependencies]
railgun-corpus = { path = "../railgun-corpus" }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

# GPU examples (`examples/mc_g2.rs`, `--features mc-g2`; `examples/g4_probe.rs`,
# `--features g4-probe`; `examples/boundary_bench.rs`, `--features boundary-bench`).
[dev-dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
redline-rocr = { path = "../redline-rocr" }
serde_json.workspace = true
sha2.workspace = true

[features]
# `examples/mc_g2.rs`: the MC G2 gate on a GPU (copies-only program).
mc-g2 = []
# `examples/g4_probe.rs`: the G4 cache-visibility silicon probe (design §5 G4).
g4-probe = []
# `examples/boundary_bench.rs`: the gfx11 PM4 boundary-cost microbenchmark.
boundary-bench = []

[[example]]
name = "g4_probe"
required-features = ["g4-probe"]

[[example]]
name = "mc_g2"
required-features = ["mc-g2"]

[[example]]
name = "boundary_bench"
required-features = ["boundary-bench"]
