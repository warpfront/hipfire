[package]
name = "hipfire-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU execution core for host-mapped (spilled) quantized weights"

[dependencies]
libc.workspace = true
rayon.workspace = true

[dev-dependencies]
# Oracle for the f16 widening in `quant` (the canonical decoder uses this crate).
half.workspace = true
proptest.workspace = true

[features]
# Builds the `w3_bench` CPU microbench (kept out of the default build).
w3-bench = []

[[example]]
name = "w3_bench"
required-features = ["w3-bench"]
