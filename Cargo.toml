[workspace.package]
version = "0.4.5"
edition = "2021"
# Outbound license for the work as a whole. Individual files whose authors
# have not elected Apache-2.0 keep an MIT SPDX header; see LICENSE and NOTICE.
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = "4.6"
fancy-regex = "0.14"
half = "2.7"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libjpeg-turbo-rs = "0.8"
libloading = "0.9"
libm = "0.2"
memmap2 = "0.9"
minijinja = "2"
minijinja-contrib = "2"
proptest = { version = "1.11", default-features = false, features = ["std"] }
rayon = "1"
regex = "1"
safetensors = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# The PeaceMaker CPU emulator and the exhaustive row-tile oracles in
# peacemaker-isa's tests run hours unoptimized. Optimize these crates in dev
# and test builds; debug assertions and overflow checks stay on.
[profile.dev.package.peacemaker-isa]
opt-level = 3

[profile.dev.package.peacemaker-ir]
opt-level = 3

[profile.dev.package.peacemaker-cdna]
opt-level = 3

[profile.dev.package.peacemaker-author]
opt-level = 3

[profile.dev.package.peacemaker-lift]
opt-level = 3

# CI test/build profile (`cargo test --profile ci`, see .github/workflows/ci.yml).
#
# The GPU-free CI job runs exhaustive CPU oracle/emulator tests (the rowtile
# and MoE-splice oracles, the sampler-distribution and PSD-projection checks,
# the launcher-ABI source scan) that took hours at opt-level 0 on a 4-core
# runner. Optimize exactly the crates those tests live in, plus every external
# dependency (cached by rust-cache, so it costs nothing per run); everything
# else stays at opt-level 0 to keep the compile cheap. Debug assertions and
# overflow checks stay ON: they are part of what the tests check. Debuginfo is
# off (panic locations and symbol names are unaffected).
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
incremental = false

[profile.ci.package."*"]
opt-level = 3

[profile.ci.package.peacemaker-isa]
opt-level = 3

[profile.ci.package.peacemaker-ir]
opt-level = 3

[profile.ci.package.peacemaker-cdna]
opt-level = 3

[profile.ci.package.peacemaker-author]
opt-level = 3

[profile.ci.package.peacemaker-lift]
opt-level = 3

[profile.ci.package.peacemaker-npu]
opt-level = 3

[profile.ci.package.hipfire-cpu]
opt-level = 3

[profile.ci.package.hipfire-dispatch]
opt-level = 3

[profile.ci.package.hipfire-quantize]
opt-level = 3

[profile.ci.package.hipfire-runtime]
opt-level = 3

[profile.ci.package.rdna-compute]
opt-level = 3
