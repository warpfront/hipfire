    "crates/hipfire-arch-deepseek4",
    "crates/hipfire-ds4-parent",
    "crates/hipfire-arch-gemma4",
    "crates/hipfire-arch-muse-glimmer",
    "crates/hipfire-arch-toy",
    "crates/hipfire-arch-qwen2",
    "crates/hipfire-arch-lfm2moe",
    "crates/hipfire-arch-raon",
    "crates/hipfire-arch-lfm2-vl",
    "crates/hipfire-arch-minimax",
    "crates/hipfire-arch-cohere2moe",
    "crates/hipfire-arch-maple",
    "crates/hipfire-arch-dots-ocr",
    "crates/hipfire-arch-diffusion",
    "crates/hipfire-quantize",
    "crates/saddle-quant",
    "crates/hipfire-detect",
    "crates/hipfire-atlas",
    "crates/redline",
    "crates/redline-rocr",
    "crates/redline-dispatch",
    "crates/hipfire-dispatch",
    "crates/hipfire-dispatch-tests",
    "crates/hipfire-cpu",
    "crates/hipfire-tui",
    "crates/hipfire-reap",
    "crates/hipfire-loader",
    "crates/hipfire-engine",
    "crates/hipfire-config",
    "crates/hipfire-registry",
