    "crates/peacemaker-rip",
    "crates/hip-bridge",
    "crates/va-bridge",
    "crates/hsa-bridge",
    "crates/rdna-compute",
    "crates/saddle-core",
    "crates/hipfire-generate",
    "crates/radiowave",
    "crates/hipfire-runtime",
    "crates/hipfire-arch-qwen35",
    "crates/hipfire-arch-qwen4",
    "crates/hipfire-pflash",
    "crates/hipfire-arch-qwen35-vl",
