name: diff-sentry

# Supply-chain scan of every PR diff with diff-sentry 0.7.0
# (https://github.com/qazbnm456/diff-sentry): obfuscated payloads,
# exfiltration, pipe-to-shell, workflow pwn-requests. The scan is
# deterministic and offline: no API key, no model, no secrets.
#
# Runs the PyPI CLI directly instead of `uses: qazbnm456/diff-sentry`: the
# org action allowlist rejects that action and its nested astral-sh/setup-uv
# (startup_failure, no check run). The step below is the action's own
# gated/report-only split. Resolution is frozen to the 0.7.0 release date so
# an unpinned transitive dependency cannot change what runs.
#
# Advisory, not a required check. Calibrated on the last 150 beta commits:
# 8 would trip `high`, all false positives typical for an LLM engine
# ("system prompt" in generate code, the `Env` column of docs/CONFIG.md).
# Markdown under docs/ is therefore scanned but report-only (a git pathspec
# `*` crosses `/`); scripts and configs under docs/ stay gated. Read a red
# run's log before merging rather than overriding it blindly.
#
# `pull_request` runs the PR's own copy of this file, so the scan does not
# cover a PR that weakens or deletes this workflow. Never move it to
# `pull_request_target`: that would run PR code with a write token. To post
# the report as a PR comment, upload it as an artifact here and post it from a
# separate `workflow_run` job that never checks out PR code.

on:
  pull_request:

concurrency:
  group: diff-sentry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FAIL_ON: high
          REPORT_ONLY: docs/*.md
          EXCLUDE_NEWER: '2026-10-22T00:00:00Z'
        run: |
          set -euo pipefail
          pipx install uv==0.13.4
          sentry=(uvx --exclude-newer "$EXCLUDE_NEWER" diff-sentry==0.7.0)

          git diff "$BASE_SHA...HEAD" -- . ":(exclude)$REPORT_ONLY" > "$RUNNER_TEMP/gated.diff"
          git diff "$BASE_SHA...HEAD" -- "$REPORT_ONLY" > "$RUNNER_TEMP/report-only.diff"

          echo "::group::$REPORT_ONLY (reported, never gated)"
          "${sentry[@]}" scan "$RUNNER_TEMP/report-only.diff" --fail-on "$FAIL_ON" || true
          echo "::endgroup::"

          "${sentry[@]}" scan "$RUNNER_TEMP/gated.diff" --fail-on "$FAIL_ON"
