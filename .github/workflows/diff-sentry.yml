name: diff-sentry

# Supply-chain scan of every PR diff with diff-sentry
# (https://github.com/qazbnm456/diff-sentry): obfuscated payloads,
# exfiltration, pipe-to-shell, workflow pwn-requests. The scan is
# deterministic and offline: no API key, no model, no secrets.
#
# Advisory, not a required check. Calibrated on the last 150 beta commits:
# 8 would trip `high`, all false positives typical for an LLM engine
# ("system prompt" in generate code, the `Env` column of docs/CONFIG.md).
# docs/** is therefore scanned but report-only; read a red run's log before
# merging rather than overriding it blindly.
#
# Runs on `pull_request` with read-only permissions on purpose. Never move it
# to `pull_request_target`: that would run PR code with a write token. If the
# report should be posted as a PR comment, upload it as an artifact here and
# post it from a separate `workflow_run` job that never checks out PR code.

on:
  pull_request:

concurrency:
  group: diff-sentry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # SHA-pinned: this third-party action runs with the workflow token.
      # Bump the SHA and the version comment together.
      - uses: qazbnm456/diff-sentry@1c4fc4a9a2562ea77d5d656f58570130d5d00579 # v0.7.0
        with:
          fail-on: high
          report-only-paths: |
            docs/**
